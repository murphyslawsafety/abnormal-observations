name: RCX-PB-GC-0001 Frozen Validation
on:
  push:
    branches: ['lab/rcx-pb-gc-0001']
    paths:
      - '.github/workflows/rcx_pb_gc_0001_validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen search manifest
        run: |
          test "$(git hash-object research/rcx_pb_gc_0001/SEARCH_MANIFEST_v0.1.1.json)" = "948d949a5c820fad0f150faf539b15f81576cdd2"
          test "$(git hash-object research/rcx_pb_gc_0001/validate_global_parity.py)" = "baa91328afcdbedc7f7f3113cabd358c0a1aaa9f"
      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Reproduce frozen v0.4 qualified corpus
        run: python research/rcx_pb_gc_0001/cloud_qualify.py
      - name: Run frozen validation selection
        run: python research/rcx_pb_gc_0001/validate_global_parity.py
      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: rcx-pb-gc-0001-frozen-validation
          path: |
            artifact/QUALIFICATION_SUMMARY.json
            artifact/VALIDATION_GLOBAL_PARITY_v0.1.json
          if-no-files-found: error
          retention-days: 30
