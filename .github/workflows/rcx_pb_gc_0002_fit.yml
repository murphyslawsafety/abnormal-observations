name: RCX-PB-GC-0002 Freeze Prospective Model
on:
  push:
    branches: ['lab/rcx-pb-gc-0002']
    paths:
      - 'research/rcx_pb_gc_0002/fit_relational_compiler.py'
      - '.github/workflows/rcx_pb_gc_0002_fit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --quiet numpy
      - name: Reproduce authorized historical corpus
        run: python research/rcx_pb_gc_0001/cloud_qualify.py
      - name: Fit the single preregistered RCX-PB-GC-0002 model
        run: python research/rcx_pb_gc_0002/fit_relational_compiler.py
      - name: Upload model-freeze artifact
        uses: actions/upload-artifact@v4
        with:
          name: rcx-pb-gc-0002-model-freeze
          path: |
            artifact/QUALIFICATION_SUMMARY.json
            artifact/RCX_PB_GC_0002_FITTED_MODEL_v1.0.json
            artifact/RCX_PB_GC_0002_FITTED_MODEL_v1.0.sha256
          if-no-files-found: error
          retention-days: 90
