name: ROX-0001A Synthetic Qualification
on:
  push:
    branches: ['lab/rox-0001']
    paths:
      - '.github/workflows/rox_0001a.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen protocol and runner
        run: |
          test "$(git hash-object research/rox_0001/ROX_0001A_PREREGISTRATION_v1.0.md)" = "aadb730cc3481de7a2ceeb3c47cf226624ba4846"
          test "$(git hash-object research/rox_0001/ROX_0001A_PREGEN_CLARIFICATION_v1.0.2.md)" = "fcb55edfdc23dbd65175f1f3a246fe65775408c0"
          test "$(git hash-object research/rox_0001/rox_0001a_synthetic.py)" = "67d648f6cac7d41bbcfa5e279398ce89ce977f17"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --quiet numpy
      - name: Execute frozen synthetic qualification
        run: python research/rox_0001/rox_0001a_synthetic.py
      - name: Hash result
        run: sha256sum ROX_0001A_RESULT_v1.0.json > ROX_0001A_RESULT_v1.0.sha256
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: rox-0001a-synthetic-result
          path: |
            ROX_0001A_RESULT_v1.0.json
            ROX_0001A_RESULT_v1.0.sha256
          if-no-files-found: error
          retention-days: 90
