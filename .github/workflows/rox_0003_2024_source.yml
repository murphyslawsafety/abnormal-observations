name: ROX-0003 Qualify 2024 Human Source
on:
  push:
    branches: ['lab/rox-0003']
    paths:
      - '.github/workflows/rox_0003_2024_source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve OSF project 5d8nh
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          curl -L --fail --retry 3 -H "Accept: application/vnd.api+json" \
            "https://api.osf.io/v2/nodes/5d8nh/" \
            -o artifact/node.json
          curl -L --fail --retry 3 -H "Accept: application/vnd.api+json" \
            "https://api.osf.io/v2/nodes/5d8nh/files/" \
            -o artifact/providers.json
          python - <<'PY'
          import json, pathlib
          j=json.load(open('artifact/providers.json'))
          rows=[]
          for x in j.get('data',[]):
              rows.append({
                  'id':x.get('id'),
                  'type':x.get('type'),
                  'name':x.get('attributes',{}).get('name'),
                  'path':x.get('attributes',{}).get('path'),
                  'files':x.get('relationships',{}).get('files',{}).get('links',{}).get('related',{}).get('href')
              })
          pathlib.Path('artifact/providers_summary.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n')
          print(json.dumps(rows,indent=2))
          PY
      - name: Enumerate osfstorage recursively
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, pathlib, time
          start='https://api.osf.io/v2/nodes/5d8nh/files/osfstorage/'
          seen=set(); files=[]; folders=[]; queue=[start]
          headers={'Accept':'application/vnd.api+json','User-Agent':'ROX-0003-source-qualifier'}
          while queue:
              url=queue.pop(0)
              if url in seen: continue
              seen.add(url)
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  j=json.load(r)
              for x in j.get('data',[]):
                  a=x.get('attributes',{})
                  links=x.get('links',{})
                  rec={
                      'id':x.get('id'),
                      'name':a.get('name'),
                      'kind':a.get('kind'),
                      'path':a.get('path'),
                      'size':a.get('size'),
                      'date_modified':a.get('date_modified'),
                      'download':links.get('download'),
                      'materialized_path':a.get('materialized_path')
                  }
                  if a.get('kind')=='folder':
                      folders.append(rec)
                      rel=x.get('relationships',{}).get('files',{}).get('links',{}).get('related',{})
                      href=rel.get('href') if isinstance(rel,dict) else rel
                      if href: queue.append(href)
                  else:
                      files.append(rec)
              nxt=j.get('links',{}).get('next')
              if nxt: queue.append(nxt)
              time.sleep(0.05)
          pathlib.Path('artifact/file_inventory.json').write_text(json.dumps(files,indent=2,sort_keys=True)+'\n')
          pathlib.Path('artifact/folder_inventory.json').write_text(json.dumps(folders,indent=2,sort_keys=True)+'\n')
          print('files',len(files),'folders',len(folders))
          for f in files:
              print(f.get('size'), f.get('materialized_path') or f.get('name'))
          PY
          sha256sum artifact/*.json > artifact/QUALIFICATION_SHA256SUMS.txt
      - name: Upload source qualification inventory
        uses: actions/upload-artifact@v4
        with:
          name: rox-0003-2024-source-inventory
          path: artifact/
          if-no-files-found: error
          retention-days: 90
