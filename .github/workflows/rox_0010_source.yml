name: ROX-0010 Qualify ChemoTrack Source
on:
  push:
    branches: ['lab/rox-0010']
    paths:
      - '.github/workflows/rox_0010_source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch fixed official trajectory sample with MLSD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/files
          python - <<'PY'
          from ftplib import FTP
          from pathlib import Path
          import hashlib, json, posixpath

          HOST='ftp.ebi.ac.uk'
          ROOT='/biostudies/fire/S-BIAD/674/S-BIAD3674/Files/ChemoTrack'
          CONDITIONS=['Cmin-0-Cmax-0','Cmin-0-Cmax-50nM']
          NFILES=6

          ftp=FTP(HOST,timeout=60); ftp.login()
          manifest=[]

          def entries(path):
              ftp.cwd(path)
              return sorted(list(ftp.mlsd()), key=lambda x:x[0])

          for cond in CONDITIONS:
              base=f'{ROOT}/{cond}/tracks_csv'
              dirs=[name for name,facts in entries(base) if facts.get('type')=='dir' and name not in ('.','..')]
              candidates=[]
              for d in dirs:
                  sub=f'{base}/{d}'
                  for name,facts in entries(sub):
                      if facts.get('type')=='file' and name.lower().endswith('.csv'):
                          candidates.append(f'{sub}/{name}')
                          if len(candidates)>=NFILES:
                              break
                  if len(candidates)>=NFILES:
                      break
              if not candidates:
                  raise SystemExit(f'No CSV files resolved at {base}')
              for remote in candidates:
                  rel=remote[len(ROOT)+1:].replace('/','__')
                  local=Path('artifact/files')/rel
                  with local.open('wb') as f:
                      ftp.retrbinary('RETR '+remote,f.write)
                  raw=local.read_bytes()
                  manifest.append({
                      'condition':cond,'remote':remote,'local':local.name,
                      'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),
                      'sampled_csv_count':len(candidates),
                      'top_level_date_directory_count':len(dirs)
                  })
          ftp.quit()
          Path('artifact/MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print(json.dumps(manifest,indent=2,sort_keys=True))
          PY
      - name: Inspect trajectory schemas without effect scoring
        shell: bash
        run: |
          python - <<'PY'
          import csv,json,pathlib,collections
          manifest=json.load(open('artifact/MANIFEST.json'))
          out=[]
          for m in manifest:
              p=pathlib.Path('artifact/files')/m['local']
              with p.open(encoding='utf-8-sig',errors='replace',newline='') as f:
                  sn=f.read(4096); f.seek(0)
                  try: dialect=csv.Sniffer().sniff(sn)
                  except: dialect=csv.excel
                  r=csv.DictReader(f,dialect=dialect)
                  fields=r.fieldnames or []
                  rows=0; sample=[]; uniq=collections.defaultdict(set)
                  for row in r:
                      rows+=1
                      if len(sample)<5: sample.append(row)
                      for k,v in row.items():
                          if v not in ('',None) and len(uniq[k])<100: uniq[k].add(v)
                  out.append({
                      'condition':m['condition'],'file':m['local'],'rows':rows,
                      'columns':fields,'sample_rows':sample,
                      'limited_unique_counts':{k:len(v) for k,v in uniq.items()}
                  })
          pathlib.Path('artifact/SCHEMA.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True)[:100000])
          PY
      - name: Upload qualification artifact
        uses: actions/upload-artifact@v4
        with:
          name: rox-0010-chemotrack-source
          path: artifact/
          if-no-files-found: error
          retention-days: 90
