<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Abnormal Observations — become one of the Observers.">
  <title>Abnormal Observations</title>
  <link rel="icon" href="media/ao-logo.png" type="image/png">
  <link rel="apple-touch-icon" href="media/ao-logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="hero">
    <div class="site-shell">
      <section class="hero-card" aria-labelledby="brand-title">
        <p class="eyebrow">A revolution in observation</p>
        <h1 id="brand-title" class="sr-only">Abnormal Observations</h1>
        <img class="hero-logo" src="media/ao-logo.png" alt="Abnormal Observations">

        <p class="count-label">Current Observers</p>
        <p class="count" data-observer-count>1</p>

        <p class="hero-copy">
          The world has no shortage of opinions. It needs people willing to
          observe before they react, question before they conclude, and notice
          what everyone else overlooked.
        </p>

        <div class="button-row">
          <button class="btn" type="button" data-join>Become One</button>
        </div>

        <div class="observer-result" data-observer-result>
          <div>You are now</div>
          <div class="observer-number">Observer <span data-observer-number></span></div>
          <div class="button-row">
            <a class="btn" href="begin.html">Begin Observing</a>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="site-shell footer-inner">
      <a class="engage-link" data-config-link="youtubeChannelUrl" href="#" aria-label="Support Abnormal Observations on YouTube">
        <img class="engage-banner" src="media/ao-engage.png" alt="If this made you think, we appreciate if you do the things that help keep this going. Like, comment, share, and follow.">
      </a>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
