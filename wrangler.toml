# Cloudflare Pages project.
# Project name in the dashboard: cj
#
# Build settings (Workers & Pages → cj → Settings → Builds):
#   Build command:                         (leave empty)
#   Deploy command:                        npx wrangler pages deploy .
#   Non-production branch deploy command:  npx wrangler pages deploy .
#   Path / Root directory:                 /
#
# Do NOT use "npx wrangler deploy" — that is for Workers, not Pages.

name = "cj"
compatibility_date = "2024-08-01"
pages_build_output_dir = "."

# Create a KV namespace in Cloudflare, paste its ID below, then bind OBSERVER_KV
# in Pages → Settings → Functions → KV namespace bindings.
[[kv_namespaces]]
binding = "OBSERVER_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
STARTING_OBSERVER_COUNT = "1"
