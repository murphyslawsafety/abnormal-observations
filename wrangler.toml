# Cloudflare Worker + static assets.
# Dashboard project name: cj (Workers & Pages → cj)
#
# Build settings for the EXISTING cj project:
#   Build command:                         (leave empty)
#   Deploy command:                        npx wrangler deploy
#   Non-production branch deploy command:  npx wrangler versions upload
#   Path / Root directory:                 /

name = "cj"
main = "src/index.js"
compatibility_date = "2024-08-01"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Serve the same site + shared counter on both domains.
[[routes]]
pattern = "abnormalobservations.com/*"
zone_name = "abnormalobservations.com"

[[routes]]
pattern = "www.abnormalobservations.com/*"
zone_name = "abnormalobservations.com"

[[routes]]
pattern = "abnormalobservations.org/*"
zone_name = "abnormalobservations.org"

[[routes]]
pattern = "www.abnormalobservations.org/*"
zone_name = "abnormalobservations.org"

# Shared observer counter (no separate KV setup required).
[[durable_objects.bindings]]
name = "OBSERVER_COUNTER"
class_name = "ObserverCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ObserverCounter"]

[vars]
# Restored baseline: Cloudflare unique visitors on abnormalobservations.com
# before the shared counter worked. New visitors continue from here.
STARTING_OBSERVER_COUNT = "1570"

# Optional: set OBSERVER_ADMIN_SECRET in Cloudflare dashboard to allow:
#   PUT  /api/observers  {"count":1570}           — adjust public floor
#   GET  /api/observers?number=13                 — lookup who holds #13
